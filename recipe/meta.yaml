{% set name = "dash-mp-components" %}
{% set version = "0.5.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/dash_mp_components-{{ version }}.tar.gz
  sha256: 803fd3caa6fb8dc1a49450a924955ef6e0a15f405b11274b99f7dd4480ca6c2f

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python >=3.6
    - pip
  run:
    - python >=3.6
    - dash
    - dash-core-components
    - dash-html-components
    - dash-table

test:
  imports:
    - dash_mp_components
  commands:
    - pip check
  requires:
    - pip

about:
  summary: Dash components for the Materials Project
  license: BSD-3-Clause-LBNL
  license_file: LICENSE
  home: https://github.com/materialsproject/dash-mp-components

extra:
  recipe-maintainers:
    - awvwgk
